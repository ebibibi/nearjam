services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nearjam
      POSTGRES_USER: nearjam
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nearjam"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
