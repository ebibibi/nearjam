name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Build Next.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
        run: npm run build

      - name: Fix .next/node_modules for Azure SWA deployment
        # Next.js (Turbopack) creates hashed symlinks in .next/node_modules/ like:
        #   pg-587764f78a6c7a9c -> ../../node_modules/pg
        #   @prisma/client-2c3a283f134fdcb6 -> ../../../node_modules/@prisma/client
        # Server bundles use these hashed names in require() calls.
        # Two deployment paths exist:
        #   1. Oryx function handler: uses .next/node_modules/ (symlinks must be real dirs)
        #   2. SWA standalone repackage: uses .next/standalone/node_modules/ (hashed dirs missing)
        # Fix: for each hashed symlink, copy the real package to BOTH locations.
        # Also copy .prisma/client/ WASM (generated by prisma generate, not in npm packages).
        run: |
          find .next/node_modules -maxdepth 2 -type l | while read symlink; do
            target=$(realpath "$symlink" 2>/dev/null)
            if [ -n "$target" ] && [ -e "$target" ]; then
              # Relative path under .next/node_modules/ (e.g. "pg-abc123" or "@prisma/client-abc")
              rel="${symlink#.next/node_modules/}"
              # Copy to standalone node_modules with the same hashed name
              mkdir -p ".next/standalone/node_modules/$(dirname "$rel")"
              cp -rL "$target" ".next/standalone/node_modules/$rel"
              # Replace symlink in .next/node_modules/ with real copy
              rm "$symlink"
              cp -rL "$target" "$symlink"
              echo "Fixed: $rel"
            else
              echo "WARNING: unresolvable symlink: $symlink"
            fi
          done
          # Copy generated Prisma WASM client to both locations
          cp -r node_modules/.prisma .next/node_modules/.prisma
          cp -r node_modules/.prisma .next/standalone/node_modules/.prisma

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: ".next/standalone"
          skip_app_build: "true"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request

    steps:
      - name: Close staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
