name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Build Next.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
        run: npm run build

      - name: Fix .next/node_modules for Azure SWA deployment
        # Next.js creates hashed symlinks in .next/node_modules/ like:
        #   pg-587764f78a6c7a9c -> ../../node_modules/pg
        #   @prisma/client-2c3a283f134fdcb6 -> ../../../node_modules/@prisma/client
        # Server bundles reference these by hashed name (e.g. require("pg-587764f78a6c7a9c")).
        # In Azure Functions runtime, ../../node_modules/ does not exist → broken symlinks → crash.
        # Fix: replace each symlink with a real copy of the target package.
        # Also copy .prisma/client/ WASM (not in npm packages, generated by prisma generate).
        run: |
          # Replace hashed symlinks with real package copies
          find .next/node_modules -maxdepth 2 -type l | while read symlink; do
            target=$(realpath "$symlink" 2>/dev/null)
            if [ -n "$target" ] && [ -e "$target" ]; then
              rm "$symlink"
              cp -rL "$target" "$symlink"
              echo "Replaced symlink: $symlink"
            else
              echo "WARNING: Cannot resolve symlink: $symlink -> $(readlink "$symlink")"
            fi
          done
          # Copy generated Prisma WASM client (not included in npm install)
          cp -r node_modules/.prisma .next/node_modules/.prisma
          cp -r node_modules/.prisma .next/standalone/node_modules/.prisma

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: ".next/standalone"
          skip_app_build: "true"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request

    steps:
      - name: Close staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
