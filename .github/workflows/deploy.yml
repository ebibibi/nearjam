name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 本番 URL（カスタムドメイン）
  APP_URL: https://nearjam.ebisuda.net
  # リビジョン URL のベース（{revision-name}.{env-domain}）
  # 新リビジョンの URL = https://ca-nearjam--{suffix}.redflower-e9742c17.eastasia.azurecontainerapps.io
  REVISION_BASE_URL: redflower-e9742c17.eastasia.azurecontainerapps.io

jobs:
  # ──────────────────────────────────────────────
  # 1. ビルド — Docker イメージをビルドして GHCR に push
  # ──────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.image-tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: image-tag
        run: echo "tag=sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 2. ステージングデプロイ — トラフィック 0% の新リビジョンを起動し
  #    "staging" ラベルを付けて専用 URL を有効化する
  # ──────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      revision-name: ${{ steps.deploy.outputs.revision-name }}
      staging-url: ${{ steps.deploy.outputs.staging-url }}

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Sync Google OAuth secrets to Container App
        # GitHub Secrets (AUTH_GOOGLE_ID / AUTH_GOOGLE_SECRET) を Container App のシークレットに反映する。
        # 未設定の場合は空文字がセットされ Google ログインは無効になるが、アプリ起動は継続する。
        # Google Cloud Console でクライアントIDを作成後に GitHub Secrets を設定すること。
        run: |
          az containerapp secret set \
            --name ca-nearjam \
            --resource-group rg-nearjam \
            --secrets \
              "auth-google-id=${{ secrets.AUTH_GOOGLE_ID }}" \
              "auth-google-secret=${{ secrets.AUTH_GOOGLE_SECRET }}"

      - name: Deploy new revision (0% traffic)
        id: deploy
        run: |
          REVISION_SUFFIX="${{ needs.build.outputs.image-tag }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${REVISION_SUFFIX}"
          REVISION_NAME="ca-nearjam--${REVISION_SUFFIX}"
          # 各リビジョンは自動的に {revision-name}.{env-domain} の URL を持つ
          STAGING_URL="https://${REVISION_NAME}.${{ env.REVISION_BASE_URL }}"

          az containerapp update \
            --name ca-nearjam \
            --resource-group rg-nearjam \
            --image "$IMAGE" \
            --revision-suffix "$REVISION_SUFFIX" \
            --set-env-vars \
              "AUTH_GOOGLE_ID=secretref:auth-google-id" \
              "AUTH_GOOGLE_SECRET=secretref:auth-google-secret"

          echo "revision-name=${REVISION_NAME}" >> $GITHUB_OUTPUT
          echo "staging-url=${STAGING_URL}" >> $GITHUB_OUTPUT
          echo "Staging URL: ${STAGING_URL}"

      - name: Wait for revision to be running
        run: |
          REVISION_NAME="${{ steps.deploy.outputs.revision-name }}"
          echo "Waiting for revision ${REVISION_NAME} to be Running..."
          for i in $(seq 1 24); do
            STATE=$(az containerapp revision show \
              --name ca-nearjam \
              --resource-group rg-nearjam \
              --revision "$REVISION_NAME" \
              --query "properties.runningState" -o tsv 2>/dev/null || echo "Unknown")
            echo "  attempt $i: state = $STATE"
            if [ "$STATE" = "Running" ]; then
              echo "Revision is running!"
              exit 0
            fi
            if [ "$STATE" = "Failed" ]; then
              echo "Revision failed to start!"
              exit 1
            fi
            sleep 5
          done
          echo "Revision did not start in time"
          exit 1

  # ──────────────────────────────────────────────
  # 3. E2E テスト — ステージング URL に向けてスモークテストを実行
  #    失敗した場合 promote は実行されず本番は影響を受けない
  # ──────────────────────────────────────────────
  e2e:
    name: E2E Tests (Staging)
    needs: [deploy-staging]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Wait for staging to respond
        run: |
          STAGING_URL="${{ needs.deploy-staging.outputs.staging-url }}"
          echo "Waiting for staging at ${STAGING_URL} ..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "${STAGING_URL}" --max-time 15 || true)
            echo "  attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Staging is ready!"
              exit 0
            fi
            sleep 5
          done
          echo "Staging did not become ready in time"
          exit 1

      - name: Run E2E smoke tests against staging
        env:
          BASE_URL: ${{ needs.deploy-staging.outputs.staging-url }}
        run: npx playwright test --reporter=github

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ──────────────────────────────────────────────
  # 4. 本番プロモート — E2E が通った場合のみ実行
  #    新リビジョンへ 100% トラフィックを切り替え、古いリビジョンを非アクティブ化
  # ──────────────────────────────────────────────
  promote:
    name: Promote to Production
    needs: [e2e, deploy-staging]
    runs-on: ubuntu-latest

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Switch 100% traffic to new revision
        run: |
          REVISION_NAME="${{ needs.deploy-staging.outputs.revision-name }}"
          az containerapp ingress traffic set \
            --name ca-nearjam \
            --resource-group rg-nearjam \
            --revision-weight "${REVISION_NAME}=100"
          echo "Production traffic switched to ${REVISION_NAME}"

      - name: Deactivate old revisions
        run: |
          REVISION_NAME="${{ needs.deploy-staging.outputs.revision-name }}"
          # 新リビジョン以外をすべて非アクティブ化（コスト削減・minReplicas 対策）
          az containerapp revision list \
            --name ca-nearjam \
            --resource-group rg-nearjam \
            --query "[?name!='${REVISION_NAME}' && properties.active==true].name" \
            -o tsv | while IFS= read -r old; do
              [ -n "$old" ] || continue
              echo "Deactivating ${old}"
              az containerapp revision deactivate \
                --name ca-nearjam \
                --resource-group rg-nearjam \
                --revision "$old" 2>/dev/null || true
          done

      - name: Done
        run: |
          echo "Deployment complete: ${{ env.APP_URL }}"
